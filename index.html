<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ahmad Salim — Portofolio</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #eaf2f8 0%, #d4e6f1 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #333;
  }

  .card {
    background: white;
    max-width: 520px;
    width: 100%;
    padding: 40px 30px;
    border-radius: 20px;
    box-shadow: 0 10px 40px rgba(23, 105, 170, 0.15);
    text-align: center;
  }

  .foto {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid #1769aa;
    margin-bottom: 20px;
    background: #eaf2f8;
  }

  h1 {
    color: #1769aa;
    font-size: 26px;
    margin-bottom: 8px;
  }

  .prodi {
    color: #666;
    font-size: 14px;
    margin-bottom: 20px;
  }

  .bio {
    font-size: 15px;
    line-height: 1.6;
    color: #444;
    margin-bottom: 25px;
  }

  .skills {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 25px;
  }

  .skill {
    background: #eaf2f8;
    color: #1769aa;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
  }

  .links {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .links a {
    text-decoration: none;
    background: #1769aa;
    color: white;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
    transition: background 0.2s;
  }

  .links a:hover {
    background: #12548a;
  }

  @media (max-width: 480px) {
    .card { padding: 30px 20px; }
    h1 { font-size: 22px; }
  }
</style>
</head>
<body>
  <div class="card">
    <img class="foto" src="foto.jpg" alt="Foto Ahmad Salim">

    <h1>Ahmad Salim</h1>
    <p class="prodi">Manajemen Informasi Komunikasi</p>

    <p class="bio">
      Mahasiswa <strong>Manajemen Informasi Komunikasi</strong> yang fokus pada
      <strong>mengolah data informasi</strong> dan tertarik pada dunia digital.
    </p>

    <div class="skills">
      <span class="skill">Desain Grafis</span>
      <span class="skill">Photoshop</span>
      <span class="skill">Illustrator</span>
      <span class="skill">Canva</span>
      <span class="skill">CapCut</span>
      <span class="skill">Manajemen Informasi</span>
    </div>

    <div class="links">
      <a href="mailto:025241461180@mail.mmtc.ac.id">Email</a>
      <a href="https://github.com/sal021" target="_blank">GitHub</a>
      <a href="https://www.shutterstock.com/g/ad28sm?rid=436214855" target="_blank">Shutterstock</a>
    </div>
  </div>
</body>
</html>
